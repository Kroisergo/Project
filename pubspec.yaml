name: encryvault
description: "EncryVault offline vault for passwords/secrets."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^10.1.2
  sodium: ^4.0.2+1
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  path: ^1.9.0
  uuid: ^4.3.3
  password_strength_checker: ^1.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
